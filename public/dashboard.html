<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Boards – TaskBoard</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <!-- ── Navbar ── -->
  <header class="navbar">
    <div class="navbar__brand">
      <span class="navbar__logo">&#9638;</span>
      <span class="navbar__title">TaskBoard</span>
    </div>
    <div class="navbar__right">
      <span class="navbar__user" id="navUser"></span>
      <button class="btn btn--ghost btn--sm" data-action="logout">Sign out</button>
    </div>
  </header>

  <!-- ── Main ── -->
  <main class="dashboard">
    <div class="dashboard__header">
      <h1 class="dashboard__title">My Boards</h1>
      <button class="btn btn--primary btn--sm" id="openCreateModal">
        + New Board
      </button>
    </div>

    <!-- Board grid -->
    <div id="boardGrid" class="board-grid">
      <div class="board-grid__loading">Loading your boards…</div>
    </div>
  </main>

  <!-- ── Create Board Modal ── -->
  <div class="modal-backdrop" id="createModalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal__header">
        <h2 class="modal__title" id="modalTitle">Create a new board</h2>
        <button class="modal__close" id="closeCreateModal" aria-label="Close">&times;</button>
      </div>

      <div id="createBoardError" class="auth-error" style="display:none;margin-bottom:.75rem"></div>

      <form id="createBoardForm" class="modal__body" novalidate>
        <div class="form-group">
          <label for="boardName" class="form-label">Board name <span class="req">*</span></label>
          <input id="boardName" name="name" type="text" class="form-input"
                 placeholder="e.g. Product Launch Q4" required />
        </div>
        <div class="form-group">
          <label for="boardDesc" class="form-label">Description <span class="form-label__optional">(optional)</span></label>
          <textarea id="boardDesc" name="description" class="form-input form-textarea"
                    placeholder="What is this board about?" rows="3"></textarea>
        </div>
        <div class="modal__footer">
          <button type="button" class="btn btn--ghost" id="cancelCreateBoard">Cancel</button>
          <button type="submit" class="btn btn--primary" id="createBoardBtn">Create Board</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
