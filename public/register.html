<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account – TaskBoard</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <!-- Brand -->
    <div class="auth-brand">
      <span class="auth-brand__logo">&#9638;</span>
      <span class="auth-brand__name">TaskBoard</span>
    </div>

    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Start managing tasks in minutes</p>

    <!-- Error banner -->
    <div id="registerError" class="auth-error" hidden></div>

    <form id="registerForm" class="auth-form" novalidate>
      <div class="form-group">
        <label for="name" class="form-label">Full name</label>
        <input
          id="name"
          name="name"
          type="text"
          class="form-input"
          placeholder="Alice Johnson"
          autocomplete="name"
          required
        />
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          class="form-input"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-wrapper">
          <input
            id="password"
            name="password"
            type="password"
            class="form-input"
            placeholder="Min. 6 characters"
            autocomplete="new-password"
            required
            minlength="6"
          />
          <button type="button" class="toggle-pw" aria-label="Toggle password visibility">
            👁
          </button>
        </div>
        <!-- Password strength indicator -->
        <div class="pw-strength" id="pwStrength" aria-live="polite"></div>
      </div>

      <button type="submit" class="btn btn--primary btn--full">Create account</button>
    </form>

    <p class="auth-footer">
      Already have an account?
      <a href="/login.html" class="auth-footer__link">Sign in</a>
    </p>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    // Password visibility toggle
    document.querySelector('.toggle-pw')?.addEventListener('click', () => {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    // Live password strength indicator
    const pwInput    = document.getElementById('password');
    const pwStrength = document.getElementById('pwStrength');
    const levels = [
      { min: 0,  label: '',         cls: ''            },
      { min: 1,  label: 'Weak',     cls: 'pw--weak'    },
      { min: 6,  label: 'Fair',     cls: 'pw--fair'    },
      { min: 10, label: 'Strong',   cls: 'pw--strong'  },
      { min: 14, label: 'Very strong', cls: 'pw--vstrong' },
    ];
    pwInput?.addEventListener('input', () => {
      const len = pwInput.value.length;
      const lvl = [...levels].reverse().find(l => len >= l.min);
      pwStrength.textContent  = lvl.label;
      pwStrength.className    = `pw-strength ${lvl.cls}`;
    });
  </script>
</body>
</html>
